<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Signup AI Quiz Portal</title>

  <style>
    /* ---------- Reset ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    /* ---------- Body ---------- */
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ---------- Container ---------- */
    .auth-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 15px;
      color: #4f46e5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* ---------- Card ---------- */
    .auth-card {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .auth-title {
      font-size: 24px;
      color: #1e293b;
      margin-bottom: 6px;
      text-align: center;
      font-weight: 700;
    }

    .auth-subtitle {
      font-size: 14px;
      color: #64748b;
      text-align: center;
      margin-bottom: 28px;
    }

    /* ---------- Form ---------- */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      color: #334155;
      font-weight: 600;
    }

    .form-group input {
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
      background: #f8fafc;
    }

    .form-group input:focus {
      border-color: #4f46e5;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    /* ---------- Button ---------- */
    .btn-primary {
      width: 100%;
      padding: 13px 20px;
      margin-top: 6px;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: #4338ca;
      transform: translateY(-1px);
    }

    /* ---------- Footer ---------- */
    .auth-footer-text {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-top: 22px;
    }

    .auth-footer-text a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-container">

    <a href="../index.html" class="back-link">← Back to Home</a>

    <div class="auth-card">
      <h1 class="auth-title">Teacher Signup</h1>
      <p class="auth-subtitle">Create your account to get started</p>

      <form id="signupForm" class="auth-form">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="e.g. Ali Khan" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="e.g. ali@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" required />
        </div>

        <button type="submit" class="btn-primary">Create Account</button>

      </form>

      <p class="auth-footer-text">
        Already have an account?
        <a href="login.html">Login</a>
      </p>
    </div>

  </div>

  <script>
    // ---------- Teacher Signup (localStorage version) ----------
    const form = document.getElementById("signupForm");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      // Validation
      if (!name || !email || !password || !confirmPassword) {
        alert("Please fill all fields.");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert("Please enter a valid email.");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
      }

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      // Check duplicate email
      const teachers = JSON.parse(localStorage.getItem("teachers")) || [];

      if (teachers.some((t) => t.email === email)) {
        alert("This email is already registered. Please login.");
        return;
      }

      // Save new teacher
      const newTeacher = {
        id: Date.now(),
        name: name,
        email: email,
        password: password,
        createdAt: new Date().toISOString(),
      };

      teachers.push(newTeacher);
      localStorage.setItem("teachers", JSON.stringify(teachers));

      alert("Account created successfully! Please login.");
      window.location.href = "login.html";
    });
  </script>

</body>
</html>
